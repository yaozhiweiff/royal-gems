name: Publish Royal Gems to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ vars.VITE_API_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check backend address
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: node -e "const url=process.env.VITE_API_URL; if(!url?.startsWith('https://')) throw Error('Set repository variable VITE_API_URL first'); const r=await fetch(url+'/api/health'); if(!r.ok || !(await r.json()).ok) throw Error('Backend health check failed')" --input-type=module
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
